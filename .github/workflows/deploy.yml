# CI/CD Pipeline — n49 Procurement Intelligence Platform
# Triggers on push to main. Runs tests, then deploys to EC2 via SSH.
#
# Required GitHub Secrets:
#   EC2_SSH_KEY  — contents of procurement-intel-key.pem (RSA private key)
#   EC2_HOST     — EC2 public IP or hostname (e.g. 16.54.103.248)
#
# Optional GitHub Secrets:
#   EC2_USER     — SSH user (default: ec2-user)
#   DEPLOY_PATH  — remote app directory (default: /opt/procurement-intel)

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running deploy

env:
  EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/procurement-intel' }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run tests
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
          OPENAI_API_KEY: sk-test-dummy
        run: python -m pytest scraper/tests/ api/tests/ db/tests/ -q --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Deploy to EC2
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add EC2 host to known_hosts (prevents interactive prompt)
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          # SSH config for convenience
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName ${{ secrets.EC2_HOST }}
            User ${{ env.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ConnectTimeout 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync code to EC2
        run: |
          rsync -azP --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'terraform' \
            --exclude '.planning' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.next' \
            --exclude 'web/.next' \
            --exclude 'web/node_modules' \
            --exclude 'postgres_data' \
            ./ ec2:${{ env.DEPLOY_PATH }}/

      - name: Build and restart containers
        run: |
          ssh ec2 << 'DEPLOY_SCRIPT'
          set -euo pipefail
          cd /opt/procurement-intel

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          MAX_API_HEALTH_ATTEMPTS=12
          API_HEALTH_RETRY_SECONDS=10

          echo "=== $(date '+%Y-%m-%d %H:%M:%S') Deployment starting ==="

          # Build new images
          echo "Building images..."
          $COMPOSE build --no-cache

          # Restart services (db stays up, app services get new images)
          # Rolling restart: api first, then web, then scraper, then nginx
          echo "Restarting API..."
          $COMPOSE up -d --no-deps api

          echo "Restarting Web..."
          $COMPOSE up -d --no-deps web

          echo "Restarting Scraper..."
          $COMPOSE up -d --no-deps scraper

          echo "Restarting Nginx..."
          $COMPOSE up -d --no-deps nginx

          # Wait for DB to be healthy before running migrations
          echo "Waiting for database..."
          sleep 5

          # Run pending database migrations
          echo "Running database migrations..."
          if ! docker exec procurement-intel-api-1 python /app/db/migrate.py; then
            echo "❌ Migration runner failed. Deployment aborted."
            echo "Review API logs on EC2: $COMPOSE logs --tail=200 api"
            exit 1
          fi
          echo "✅ Database migrations completed"

          # Wait for services to stabilize after migrations
          echo "Waiting for services to stabilize..."
          sleep 5

          # Health checks
          echo "Running health checks..."
          $COMPOSE ps

          # Block until API container is running and /health returns 200.
          attempt=1
          while [ "$attempt" -le "$MAX_API_HEALTH_ATTEMPTS" ]; do
            CONTAINER_STATE=$(docker inspect --format '{{.State.Status}}' procurement-intel-api-1 2>/dev/null || echo "missing")
            CONTAINER_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' procurement-intel-api-1 2>/dev/null || echo "unknown")
            API_STATUS=$(docker exec procurement-intel-api-1 \
              python -c "import httpx; r=httpx.get('http://localhost:8000/health', timeout=5.0); print(r.status_code)" \
              2>/tmp/api_health_error.log || echo "FAIL")

            echo "API health attempt $attempt/$MAX_API_HEALTH_ATTEMPTS: container=$CONTAINER_STATE health=$CONTAINER_HEALTH status=$API_STATUS"

            if [ "$CONTAINER_STATE" = "running" ] && [ "$API_STATUS" = "200" ]; then
              echo "✅ API health verification passed"
              break
            fi

            if [ "$attempt" -eq "$MAX_API_HEALTH_ATTEMPTS" ]; then
              echo "❌ API health verification failed after $MAX_API_HEALTH_ATTEMPTS attempts"
              if [ -s /tmp/api_health_error.log ]; then
                echo "--- Last API health probe error ---"
                tail -n 20 /tmp/api_health_error.log
              fi
              echo "--- docker compose ps ---"
              $COMPOSE ps
              echo "--- API logs (tail 120) ---"
              $COMPOSE logs --tail=120 api || true
              exit 1
            fi

            sleep "$API_HEALTH_RETRY_SECONDS"
            attempt=$((attempt + 1))
          done

          # Prune old images
          docker image prune -f

          echo "=== $(date '+%Y-%m-%d %H:%M:%S') Deployment complete ==="
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          MAX_PUBLIC_HEALTH_ATTEMPTS=12
          PUBLIC_HEALTH_RETRY_SECONDS=10
          TARGET_URL="https://procurement.eliastools.com"

          attempt=1
          while [ "$attempt" -le "$MAX_PUBLIC_HEALTH_ATTEMPTS" ]; do
            HTTP_CODE=$(curl -sS -o /tmp/public_smoke_response.txt -w "%{http_code}" \
              --max-time 15 \
              "$TARGET_URL" 2>/tmp/public_smoke_error.log || echo "000")

            echo "Public smoke attempt $attempt/$MAX_PUBLIC_HEALTH_ATTEMPTS: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Public endpoint is responding (HTTP $HTTP_CODE)"
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_PUBLIC_HEALTH_ATTEMPTS" ]; then
              echo "❌ Public smoke test failed after $MAX_PUBLIC_HEALTH_ATTEMPTS attempts"
              if [ -s /tmp/public_smoke_error.log ]; then
                echo "--- Last curl error ---"
                cat /tmp/public_smoke_error.log
              fi
              if [ -s /tmp/public_smoke_response.txt ]; then
                echo "--- Response body preview (first 300 bytes) ---"
                head -c 300 /tmp/public_smoke_response.txt
                echo
              fi
              exit 1
            fi

            sleep "$PUBLIC_HEALTH_RETRY_SECONDS"
            attempt=$((attempt + 1))
          done
