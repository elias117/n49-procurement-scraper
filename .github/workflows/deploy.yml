# CI/CD Pipeline — n49 Procurement Intelligence Platform
# Triggers on push to main. Runs tests, then deploys to EC2 via SSH.
#
# Required GitHub Secrets:
#   EC2_SSH_KEY  — contents of procurement-intel-key.pem (RSA private key)
#   EC2_HOST     — EC2 public IP or hostname (e.g. 16.54.103.248)
#
# Optional GitHub Secrets:
#   EC2_USER     — SSH user (default: ec2-user)
#   DEPLOY_PATH  — remote app directory (default: /opt/procurement-intel)

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running deploy

env:
  EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/procurement-intel' }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run tests
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
          OPENAI_API_KEY: sk-test-dummy
        run: python -m pytest scraper/tests/ api/tests/ db/tests/ -q --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Deploy to EC2
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add EC2 host to known_hosts (prevents interactive prompt)
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          # SSH config for convenience
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName ${{ secrets.EC2_HOST }}
            User ${{ env.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ConnectTimeout 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync code to EC2
        run: |
          rsync -azP --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'terraform' \
            --exclude '.planning' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.next' \
            --exclude 'web/.next' \
            --exclude 'web/node_modules' \
            --exclude 'postgres_data' \
            ./ ec2:${{ env.DEPLOY_PATH }}/

      - name: Build and restart containers
        run: |
          ssh ec2 << 'DEPLOY_SCRIPT'
          set -euo pipefail
          cd /opt/procurement-intel

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          echo "=== $(date '+%Y-%m-%d %H:%M:%S') Deployment starting ==="

          # Build new images
          echo "Building images..."
          $COMPOSE build --no-cache

          # Restart services (db stays up, app services get new images)
          # Rolling restart: api first, then web, then scraper, then nginx
          echo "Restarting API..."
          $COMPOSE up -d --no-deps api

          echo "Restarting Web..."
          $COMPOSE up -d --no-deps web

          echo "Restarting Scraper..."
          $COMPOSE up -d --no-deps scraper

          echo "Restarting Nginx..."
          $COMPOSE up -d --no-deps nginx

          # Wait for DB to be healthy before running migrations
          echo "Waiting for database..."
          sleep 5

          # Run pending database migrations (blocking)
          echo "Running database migrations (blocking)..."
          set +e
          MIGRATION_OUTPUT=$($COMPOSE exec -T api python /app/db/migrate.py 2>&1)
          MIGRATION_EXIT=$?
          set -e
          echo "$MIGRATION_OUTPUT"

          if [ "$MIGRATION_EXIT" -ne 0 ]; then
            echo "::error::Migration runner failed with exit code $MIGRATION_EXIT"
            echo "Recent API logs (last 120 lines):"
            $COMPOSE logs --tail=120 api || true
            exit 1
          fi

          # Wait for services to stabilize after migrations
          echo "Waiting for services to stabilize..."
          sleep 5

          # In-container API health check (blocking, bounded retries)
          echo "Running in-container API health checks..."
          $COMPOSE ps

          API_MAX_ATTEMPTS=12
          API_RETRY_SLEEP_SECONDS=5
          API_HEALTHY=0

          for ATTEMPT in $(seq 1 "$API_MAX_ATTEMPTS"); do
            echo "API health attempt ${ATTEMPT}/${API_MAX_ATTEMPTS}"

            set +e
            API_OUTPUT=$($COMPOSE exec -T api \
              python -c "import httpx; r=httpx.get('http://localhost:8000/health', timeout=5.0); print(r.status_code)" \
              2>&1)
            API_EXIT=$?
            set -e

            API_STATUS=$(printf '%s\n' "$API_OUTPUT" | tail -n 1 | tr -d '\r')
            echo "API health result: exit=${API_EXIT}, status=${API_STATUS}"

            if [ "$API_EXIT" -eq 0 ] && [ "$API_STATUS" = "200" ]; then
              API_HEALTHY=1
              break
            fi

            if [ "$ATTEMPT" -lt "$API_MAX_ATTEMPTS" ]; then
              echo "Retrying API health in ${API_RETRY_SLEEP_SECONDS}s..."
              sleep "$API_RETRY_SLEEP_SECONDS"
            fi
          done

          if [ "$API_HEALTHY" -ne 1 ]; then
            echo "::error::API health check failed after ${API_MAX_ATTEMPTS} attempts."
            echo "Container status:"
            $COMPOSE ps
            echo "Recent API logs (last 120 lines):"
            $COMPOSE logs --tail=120 api || true
            exit 1
          fi

          echo "✅ API health check passed"

          # Prune old images
          docker image prune -f

          echo "=== $(date '+%Y-%m-%d %H:%M:%S') Deployment complete ==="
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          set -euo pipefail

          # Blocking public smoke test with bounded retries.
          PUBLIC_URL="https://procurement.eliastools.com"
          PUBLIC_MAX_ATTEMPTS=10
          PUBLIC_RETRY_SLEEP_SECONDS=6
          PUBLIC_HEALTHY=0

          for ATTEMPT in $(seq 1 "$PUBLIC_MAX_ATTEMPTS"); do
            echo "Public smoke test attempt ${ATTEMPT}/${PUBLIC_MAX_ATTEMPTS}: ${PUBLIC_URL}"

            set +e
            HTTP_CODE=$(curl -sS \
              --connect-timeout 5 \
              --max-time 15 \
              -D /tmp/public-health-headers.txt \
              -o /tmp/public-health-body.txt \
              -w "%{http_code}" \
              "${PUBLIC_URL}" 2>/tmp/public-health-curl-error.log)
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ]; then
              HTTP_CODE="000"
            fi

            echo "Public smoke test result: curl_exit=${CURL_EXIT}, http_code=${HTTP_CODE}"

            if [ "$CURL_EXIT" -eq 0 ] && { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; }; then
              PUBLIC_HEALTHY=1
              break
            fi

            if [ -s /tmp/public-health-curl-error.log ]; then
              echo "curl error output:"
              cat /tmp/public-health-curl-error.log
            fi

            if [ -s /tmp/public-health-headers.txt ]; then
              echo "Last response headers:"
              sed -n '1,20p' /tmp/public-health-headers.txt
            fi

            if [ "$ATTEMPT" -lt "$PUBLIC_MAX_ATTEMPTS" ]; then
              echo "Retrying public smoke test in ${PUBLIC_RETRY_SLEEP_SECONDS}s..."
              sleep "$PUBLIC_RETRY_SLEEP_SECONDS"
            fi
          done

          if [ "$PUBLIC_HEALTHY" -ne 1 ]; then
            echo "::error::Public smoke test failed after ${PUBLIC_MAX_ATTEMPTS} attempts."
            if [ -s /tmp/public-health-curl-error.log ]; then
              echo "Final curl error output:"
              cat /tmp/public-health-curl-error.log
            fi
            if [ -s /tmp/public-health-headers.txt ]; then
              echo "Final response headers:"
              sed -n '1,40p' /tmp/public-health-headers.txt
            fi
            if [ -s /tmp/public-health-body.txt ]; then
              echo "Final response body (first 400 chars):"
              head -c 400 /tmp/public-health-body.txt
              echo
            fi
            exit 1
          fi

          echo "✅ Public smoke test passed (HTTP ${HTTP_CODE})"
