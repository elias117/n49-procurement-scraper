services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  scraper:
    build: ./scraper
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    shm_size: '2gb'
    mem_limit: 4g
    networks:
      - internal

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:
  certbot_etc:
  certbot_var:

networks:
  internal:
    driver: bridge
